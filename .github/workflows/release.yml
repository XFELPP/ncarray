name: Build Release
on:
  push:
    # Disable this for forks. Its expensive, and the PyPI portion will fail later
    if: github.repository_owner == "XFELPP"
    # For now, only build for release tags
    tags:
      - 'v*'
  workflow_dispatch:
    # Add specific dispatch action for PyPI -- can disable publishing
    # Currently need to disable for quota reasons.
    inputs:
      publish_to_pypi:
        description: "Publish compiled wheels to PyPI"
        type: boolean
        required: true
        default: false

jobs:
  # Build binaries
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["cp38-*", "cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*"]

    steps:
      - name: Free Unused Disk Space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          df -h

      - name: Create Swap File
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 12G /swapfile_ncarray
          sudo chmod 600 /swapfile_ncarray
          sudo mkswap /swapfile_ncarray
          sudo swapon /swapfile_ncarray
          free -h

      - uses: actions/checkout@v6

        # MANUALLY try and pull this down. So Windows doesn't break.... every time
      - name: PRE-DOWNLOAD
        shell: bash
        run: |
          mkdir -p .cibw_cache
          for i in {1..5}; do
            curl -L -o .cibw_cache/virtualenv-20.27.1.pyz https://raw.githubusercontent.com/pypa/get-virtualenv/20.27.1/public/virtualenv.pyz && break || sleep 15
          done

      # Cache pip (for speedup)
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache ccache (for speedup)
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # interpreter caching (to avoid running into HTTP request rate limiting)
      - name: Cache cibuildwheel
        uses: actions/cache@v5
        with:
          path: .cibw_cache
          key: ${{ runner.os }}-cibw-${{ matrix.python }}-v1
          restore-keys: |
            ${{ runner.os }}-cibw-${{ matrix.python }}-

      - name: Grab Windows CUDA
        uses: Jimver/cuda-toolkit@v0.2.34
        if: runner.os == 'Windows'
        id: cuda-toolkit
        with:
          cuda: '12.8.0'
          use-github-cache: 'false'

      - name: Clean Strawberry Perl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = $env:PATH -split ';' | Where-Object { $_ -notlike '*Strawberry*' }
          $newPath = $paths -join ';'
          echo "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64

      - name: Build wheels
        # Check pyproject.toml for supported versions and additional config
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: ${{ matrix.python }}
          CIBW_CACHE_PATH: ".cibw_cache"
          PreferredToolArchitecture: "x64"

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # Build source distribution
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11" # Shouldn't matter

      # Meson setup runs, so we still need these unfortunately (for subprojects)
      # The code will not actually be compiled for the sdist
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # Create release, publish
  create_release_and_publish_to_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Gather build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        # Force need to manually specify the PyPI publishing
        # Currently disabled by default pending quota request
        if: inputs.publish_to_pypi == true
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
