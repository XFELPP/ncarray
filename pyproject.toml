[build-system]
requires = ["setuptools", "meson-python", "pybind11"]
build-backend = "mesonpy"

[project]
name = "ncarray"
description="NumPy compatible non-contiguous arrays."
requires-python = ">=3.8"
dynamic = ["version"]
authors = [
    { name = "Gabriel Dorlhiac", email = "gabriel@dorlhiac.com" },
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[tool.meson-python.args]
install = ['--skip-subprojects']

[tool.cibuildwheel]
# pp* (PyPy for now)
# cp36-* (Python 3.6)
# cp37-* (Python 3.7)
# *i686 (32-bit builds)
skip = ["pp*", "cp36-*", "cp37-*", "*i686", "*-win32"]

# Try to set things up to cache what's possible to make things faster
build-frontend = { name = "pip", args = ["--no-build-isolation"] }

before-build = [
    "python -m pip install -U pip",
    "python -m pip install \"meson>=1.10.1\" meson-python ninja pybind11 setuptools",
]

# For C++23 need a newer GCC coming from manylinux_2_28 (GCC 13) and later
# manylinux_2_34 will give GCC 14
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
before-all = [
    """
    if command -v apt-get >/dev/null; then
        apt-get update && apt-get install -y ccache
    elif command -v dnf >/dev/null; then
        dnf install -y epel-release && dnf install -y ccache
    elif command -v yum >/dev/null; then
        yum install -y epel-release && yum install -y ccache
    elif command -v apk >/dev/null; then
        apk add ccache
    fi
    ccache -z
    """,
]
repair-wheel-command = "auditwheel repair --exclude libncarray.so.1 --lib-sdir . -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-all = "brew install ccache && ccache -z"
[tool.cibuildwheel.windows]
before-all = "choco install sccache"

[tool.cibuildwheel.linux.environment]
CC = "ccache gcc"
CXX = "ccache g++"
CCACHE_DIR = "/project/.ccache"

[tool.cibuildwheel.macos.environment]
CC = "ccache clang"
CXX = "ccache clang++"
CCACHE_DIR = ".ccache"

[tool.cibuildwheel.windows.environment]
CC = "sccache cl"
CXX = "sccache cl"
SCCACHE_DIR = ".ccache"

